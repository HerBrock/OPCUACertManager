[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opcuacertmanager"
version = "0.2.0"
description = "Professional X.509 certificate manager for OPC UA environments"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["opc-ua", "x509", "certificates", "pki", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.290",
]

[project.scripts]
opcuacertmanager = "src.ui.main_window:main"

[project.urls]
Repository = "https://github.com/HerBrock/OPCUACertManager.git"

[tool.commitizen]
version = "1.1.0"
tag_format = "v$version"
version_files = [
    "src/__init__.py:__version__"
]
changelog_file = "CHANGELOG.md"